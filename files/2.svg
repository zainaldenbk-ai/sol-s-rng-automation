<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 1000 80'
    style='background-color: #00000000;'
    width='1000px' height='80px'>

    <style>
@font-face {
  font-family: 'Orbitron';
  font-style: normal;
  font-weight: 700;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='5500ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h1000 ; m0,40 h1000 ; m0,40 h0' keyTimes='0;0.72727272727273;0.81818181818182;1' />
                    </path>
    <text font-family='"Orbitron", monospace' fill='#50e7dd' font-size='34'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            THANK YOU FOR USING SOLS RNG SCRIPT
        </textPath>
    </text>
                <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='5500ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h1000 ; m0,40 h1000 ; m0,40 h0' keyTimes='0;0.72727272727273;0.81818181818182;1' />
                    </path>
    <text font-family='"Orbitron", monospace' fill='#50e7dd' font-size='34'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            ROLL UNTIL YOU WIN
        </textPath>
    </text>
                <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='5500ms' fill='remove'
                    values='m0,40 h0 ; m0,40 h1000 ; m0,40 h1000 ; m0,40 h0' keyTimes='0;0.72727272727273;0.81818181818182;1' />
                    </path>
    <text font-family='"Orbitron", monospace' fill='#50e7dd' font-size='34'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            STAY UNDETECTED
        </textPath>
    </text>
</svg>
